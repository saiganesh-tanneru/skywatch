<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Bennu Dark Carbonaceous Rubble Gradient -->
    <radialGradient id="bennuRock" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="35%" stop-color="#3f3f46" />
      <stop offset="70%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
  </defs>

  <!-- Bennu Characteristic Spinning-Top Diamond Silhouette -->
  <polygon points="256,50 370,140 455,256 365,370 256,462 145,370 57,256 140,140" fill="url(#bennuRock)" />

  <!-- Prominent Equatorial Ridge (Where material migrates due to rotation) -->
  <path d="M 57,256 Q 256,280 455,256" fill="none" stroke="#71717a" stroke-width="5" opacity="0.8" />
  <path d="M 65,260 Q 256,286 445,260" fill="none" stroke="#27272a" stroke-width="4" opacity="0.9" />

  <!-- Giant Perched Boulders (e.g. Benben Saxum & Gargoyle Saxum) -->
  <polygon points="230,120 255,105 270,125 245,135" fill="#71717a" stroke="#a1a1aa" stroke-width="1.5" />
  <polygon points="170,220 200,205 210,230 185,240" fill="#52525b" stroke="#71717a" stroke-width="1.5" />
  <polygon points="310,210 340,195 355,225 325,235" fill="#3f3f46" stroke="#52525b" stroke-width="1.5" />
  <polygon points="270,330 300,315 315,340 280,355" fill="#27272a" stroke="#52525b" stroke-width="1.5" />
  <polygon points="150,310 180,300 190,325 160,335" fill="#3f3f46" stroke="#52525b" stroke-width="1.5" />

  <!-- Nightingale Crater (NASA OSIRIS-REx Sample Site) -->
  <circle cx="230" cy="160" r="30" fill="#18181b" stroke="#52525b" stroke-width="2" />
  <circle cx="230" cy="160" r="12" fill="#27272a" />
  <!-- Small sampling marker pin -->
  <circle cx="230" cy="160" r="3" fill="#38bdf8" />

  <!-- Rough Rubble Piles & Facets -->
  <line x1="256" y1="50" x2="230" y2="160" stroke="#71717a" stroke-width="1.5" opacity="0.6" />
  <line x1="256" y1="50" x2="310" y2="210" stroke="#52525b" stroke-width="1.5" opacity="0.6" />
  <line x1="455" y1="256" x2="270" y2="330" stroke="#27272a" stroke-width="2" opacity="0.8" />
  <line x1="57" y1="256" x2="150" y2="310" stroke="#3f3f46" stroke-width="2" opacity="0.7" />

  <!-- Shadow Terminator (Right side in shadow) -->
  <path d="M 256,50 
           L 370,140 
           L 455,256 
           L 365,370 
           L 256,462 
           C 330,370 360,260 340,160 Z" 
        fill="#000000" opacity="0.7" />
</svg>
