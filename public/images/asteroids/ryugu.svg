<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ryugu C-type Carbonaceous Dark Surface -->
    <radialGradient id="ryuguSurface" cx="42%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#4b5563" />
      <stop offset="35%" stop-color="#374151" />
      <stop offset="70%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </radialGradient>
  </defs>

  <!-- Ryugu Distinct Octagonal Spinning-Top Silhouette -->
  <polygon points="256,58 350,135 440,240 450,268 375,370 256,450 140,370 65,268 75,240 160,135" fill="url(#ryuguSurface)" />

  <!-- Equatorial Bulge Ridge -->
  <path d="M 65,254 Q 256,280 450,254" fill="none" stroke="#6b7280" stroke-width="6" opacity="0.8" />
  <path d="M 70,258 Q 256,285 445,258" fill="none" stroke="#111827" stroke-width="4" opacity="0.9" />

  <!-- Giant Otohime Saxum (Largest Boulder at South Pole) -->
  <polygon points="240,400 270,390 285,420 250,430" fill="#6b7280" stroke="#9ca3af" stroke-width="2" />
  <!-- Urashima Crater -->
  <ellipse cx="230" cy="180" rx="45" ry="32" fill="#111827" stroke="#4b5563" stroke-width="2.5" />
  <circle cx="230" cy="180" r="4" fill="#38bdf8" title="Hayabusa2 TD1 Site" />

  <!-- Additional Rugged Boulders -->
  <polygon points="150,200 175,185 185,210 160,220" fill="#4b5563" stroke="#6b7280" stroke-width="1.5" />
  <polygon points="320,190 350,175 365,200 335,215" fill="#374151" stroke="#4b5563" stroke-width="1.5" />
  <polygon points="180,310 205,295 220,320 190,335" fill="#1f2937" stroke="#4b5563" stroke-width="1.5" />
  <polygon points="310,310 340,295 355,320 325,335" fill="#111827" stroke="#374151" stroke-width="1.5" />

  <!-- Terminator Shadow -->
  <path d="M 256,58 
           L 350,135 
           L 440,240 
           L 450,268 
           L 375,370 
           L 256,450 
           C 340,360 370,250 335,145 Z" 
        fill="#000000" opacity="0.72" />
</svg>
