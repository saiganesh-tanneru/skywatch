<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hubbleFoil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="hubbleSolar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <pattern id="hubbleGrid" width="6" height="8" patternUnits="userSpaceOnUse">
      <rect width="6" height="8" fill="none" stroke="#f59e0b" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Hubble Solar Array Wings (Left and Right) -->
  <g id="hubble-wings">
    <!-- Left Wing -->
    <rect x="50" y="210" width="135" height="42" rx="2" fill="url(#hubbleSolar)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="50" y="210" width="135" height="42" fill="url(#hubbleGrid)" opacity="0.6" />
    <line x1="45" y1="231" x2="190" y2="231" stroke="#cbd5e1" stroke-width="2.5" />

    <!-- Right Wing -->
    <rect x="327" y="210" width="135" height="42" rx="2" fill="url(#hubbleSolar)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="327" y="210" width="135" height="42" fill="url(#hubbleGrid)" opacity="0.6" />
    <line x1="322" y1="231" x2="467" y2="231" stroke="#cbd5e1" stroke-width="2.5" />
  </g>

  <!-- Hubble Main Body (Optical Telescope Assembly Cylinder) -->
  <g id="hubble-telescope">
    <!-- Aft Equipment Section (wider base) -->
    <rect x="228" y="270" width="56" height="110" rx="8" fill="url(#hubbleFoil)" stroke="#e2e8f0" stroke-width="2" />
    <!-- Forward Light Shield (narrower cylinder) -->
    <rect x="233" y="130" width="46" height="142" rx="5" fill="url(#hubbleFoil)" stroke="#e2e8f0" stroke-width="2" />

    <!-- Aperture Door (Open at 45 degree angle) -->
    <line x1="233" y1="130" x2="200" y2="90" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
    <!-- Dark Optical Interior / Primary Mirror entrance -->
    <ellipse cx="256" cy="130" rx="21" ry="8" fill="#030712" stroke="#38bdf8" stroke-width="1.5" />

    <!-- High Gain Antenna Boom Dish (Left) -->
    <line x1="228" y1="290" x2="190" y2="310" stroke="#cbd5e1" stroke-width="2" />
    <ellipse cx="185" cy="312" rx="10" ry="14" fill="#f8fafc" stroke="#94a3b8" />

    <!-- High Gain Antenna Boom Dish (Right) -->
    <line x1="284" y1="290" x2="322" y2="310" stroke="#cbd5e1" stroke-width="2" />
    <ellipse cx="327" cy="312" rx="10" ry="14" fill="#f8fafc" stroke="#94a3b8" />
  </g>
</svg>
