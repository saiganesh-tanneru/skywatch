<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tiangongSolar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <linearGradient id="tiangongHull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <pattern id="tiangongGrid" width="10" height="12" patternUnits="userSpaceOnUse">
      <rect width="10" height="12" fill="none" stroke="#38bdf8" stroke-width="0.75" />
    </pattern>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Tianhe Core Module (Central longitudinal axis) -->
  <g id="tianhe-core">
    <!-- Main Habitation section -->
    <rect x="238" y="160" width="36" height="110" rx="8" fill="url(#tiangongHull)" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Service / Propulsion module -->
    <rect x="242" y="272" width="28" height="65" rx="5" fill="url(#tiangongHull)" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Forward Docking Hub -->
    <circle cx="256" cy="150" r="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Core module solar wings -->
    <rect x="150" y="285" width="88" height="26" rx="2" fill="url(#tiangongSolar)" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="150" y="285" width="88" height="26" fill="url(#tiangongGrid)" opacity="0.5" />
    <rect x="274" y="285" width="88" height="26" rx="2" fill="url(#tiangongSolar)" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="274" y="285" width="88" height="26" fill="url(#tiangongGrid)" opacity="0.5" />
  </g>

  <!-- Wentian & Mengtian Lab Modules (T-formation horizontal branches) -->
  <g id="wentian-mengtian">
    <!-- Wentian Lab (Left) -->
    <rect x="120" y="132" width="115" height="34" rx="6" fill="url(#tiangongHull)" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Wentian Giant Solar Array Wings -->
    <rect x="42" y="50" width="38" height="200" rx="3" fill="url(#tiangongSolar)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="42" y="50" width="38" height="200" fill="url(#tiangongGrid)" opacity="0.6" />
    <line x1="61" y1="45" x2="61" y2="255" stroke="#ffffff" stroke-width="2" />

    <!-- Mengtian Lab (Right) -->
    <rect x="277" y="132" width="115" height="34" rx="6" fill="url(#tiangongHull)" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Mengtian Giant Solar Array Wings -->
    <rect x="432" y="50" width="38" height="200" rx="3" fill="url(#tiangongSolar)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="432" y="50" width="38" height="200" fill="url(#tiangongGrid)" opacity="0.6" />
    <line x1="451" y1="45" x2="451" y2="255" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Shenzhou Crew Craft docked forward -->
  <g id="shenzhou-docked">
    <ellipse cx="256" cy="118" rx="8" ry="12" fill="#e2e8f0" stroke="#94a3b8" />
    <polygon points="256,92 262,106 250,106" fill="#94a3b8" />
  </g>

  <!-- Robotic Arm -->
  <path d="M 238 210 Q 210 240 220 270" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <circle cx="220" cy="270" r="3" fill="#ef4444" />
</svg>
