<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="commsSolar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <pattern id="commsGrid" width="8" height="10" patternUnits="userSpaceOnUse">
      <rect width="8" height="10" fill="none" stroke="#0369a1" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Dual Solar Wings -->
  <g id="solar-wings">
    <!-- Left Wing -->
    <rect x="55" y="226" width="135" height="60" rx="3" fill="url(#commsSolar)" stroke="#0284c7" stroke-width="1.5" />
    <rect x="55" y="226" width="135" height="60" fill="url(#commsGrid)" opacity="0.65" />
    <line x1="45" y1="256" x2="195" y2="256" stroke="#94a3b8" stroke-width="3" />

    <!-- Right Wing -->
    <rect x="322" y="226" width="135" height="60" rx="3" fill="url(#commsSolar)" stroke="#0284c7" stroke-width="1.5" />
    <rect x="322" y="226" width="135" height="60" fill="url(#commsGrid)" opacity="0.65" />
    <line x1="317" y1="256" x2="467" y2="256" stroke="#94a3b8" stroke-width="3" />
  </g>

  <!-- Central Spacecraft Bus (Cube wrapped in gold thermal insulation foil) -->
  <g id="spacecraft-bus">
    <rect x="220" y="215" width="72" height="82" rx="8" fill="url(#goldFoil)" stroke="#fef08a" stroke-width="2" />
    <!-- Radiator panels on bus -->
    <rect x="232" y="235" width="48" height="42" rx="4" fill="#1e293b" stroke="#64748b" />
  </g>

  <!-- Parabolic Communication Dish Antenna (Forward facing) -->
  <g id="parabolic-dish">
    <!-- Antenna support struts -->
    <line x1="256" y1="215" x2="256" y2="160" stroke="#cbd5e1" stroke-width="3" />
    <line x1="235" y1="215" x2="256" y2="160" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="277" y1="215" x2="256" y2="160" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Large Parabolic Dish -->
    <ellipse cx="256" cy="150" rx="45" ry="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <ellipse cx="256" cy="150" rx="35" ry="12" fill="#e2e8f0" stroke="#cbd5e1" />

    <!-- Sub-reflector feed horn -->
    <line x1="256" y1="150" x2="256" y2="120" stroke="#38bdf8" stroke-width="2" />
    <circle cx="256" cy="120" r="4" fill="#38bdf8" />
  </g>

  <!-- Thruster nozzle (Aft) -->
  <polygon points="248,297 264,297 268,312 244,312" fill="#475569" stroke="#94a3b8" />
</svg>
