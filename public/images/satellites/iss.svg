<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Solar array copper/gold gradient -->
    <linearGradient id="solarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="75%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Metallic module gradient -->
    <linearGradient id="metalCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Thermal radiator white gradient -->
    <linearGradient id="radiatorWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Solar panel grid pattern -->
    <pattern id="solarGrid" width="8" height="12" patternUnits="userSpaceOnUse">
      <rect width="8" height="12" fill="none" stroke="#78350f" stroke-width="0.75" />
      <line x1="0" y1="6" x2="8" y2="6" stroke="#d97706" stroke-width="0.5" />
    </pattern>

    <!-- Subtle glow filter -->
    <filter id="spaceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ISS Integrated Truss Structure (Long central backbone) -->
  <g id="truss-backbone">
    <!-- Main metallic truss girder -->
    <rect x="56" y="250" width="400" height="12" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Truss internal triangular cross-bracing -->
    <path d="M 60 250 L 70 262 L 80 250 L 90 262 L 100 250 L 110 262 L 120 250 L 130 262 L 140 250 L 150 262 L 160 250 L 170 262 L 180 250 L 190 262 L 200 250 L 210 262 L 220 250 L 230 262 L 240 250 L 250 262 L 260 250 L 270 262 L 280 250 L 290 262 L 300 250 L 310 262 L 320 250 L 330 262 L 340 250 L 350 262 L 360 250 L 370 262 L 380 250 L 390 262 L 400 250 L 410 262 L 420 250 L 430 262 L 440 250 L 450 262" stroke="#64748b" stroke-width="1.2" fill="none" />
  </g>

  <!-- THERMAL RADIATOR PANELS (White heat dissipation fins) -->
  <g id="radiators">
    <!-- Starboard Radiators -->
    <rect x="180" y="270" width="18" height="70" rx="1.5" fill="url(#radiatorWhite)" stroke="#94a3b8" />
    <rect x="202" y="270" width="18" height="70" rx="1.5" fill="url(#radiatorWhite)" stroke="#94a3b8" />
    <rect x="224" y="270" width="18" height="70" rx="1.5" fill="url(#radiatorWhite)" stroke="#94a3b8" />

    <!-- Port Radiators -->
    <rect x="270" y="270" width="18" height="70" rx="1.5" fill="url(#radiatorWhite)" stroke="#94a3b8" />
    <rect x="292" y="270" width="18" height="70" rx="1.5" fill="url(#radiatorWhite)" stroke="#94a3b8" />
    <rect x="314" y="270" width="18" height="70" rx="1.5" fill="url(#radiatorWhite)" stroke="#94a3b8" />
  </g>

  <!-- SOLAR ARRAY WINGS (8 massive gold-amber photovoltaic panels) -->
  <g id="solar-arrays">
    <!-- FAR-LEFT WINGS (P6 / P4 Arrays) -->
    <!-- Top-left array pair -->
    <g>
      <rect x="36" y="70" width="36" height="170" rx="2" fill="url(#solarGold)" stroke="#d97706" stroke-width="1.5" />
      <rect x="36" y="70" width="36" height="170" fill="url(#solarGrid)" opacity="0.65" />
      <rect x="76" y="70" width="36" height="170" rx="2" fill="url(#solarGold)" stroke="#d97706" stroke-width="1.5" />
      <rect x="76" y="70" width="36" height="170" fill="url(#solarGrid)" opacity="0.65" />
      <!-- Solar array mast / containment can -->
      <line x1="74" y1="65" x2="74" y2="248" stroke="#38bdf8" stroke-width="2.5" />
    </g>
    <!-- Bottom-left array pair -->
    <g>
      <rect x="36" y="272" width="36" height="170" rx="2" fill="url(#solarGold)" stroke="#d97706" stroke-width="1.5" />
      <rect x="36" y="272" width="36" height="170" fill="url(#solarGrid)" opacity="0.65" />
      <rect x="76" y="272" width="36" height="170" rx="2" fill="url(#solarGold)" stroke="#d97706" stroke-width="1.5" />
      <rect x="76" y="272" width="36" height="170" fill="url(#solarGrid)" opacity="0.65" />
      <line x1="74" y1="264" x2="74" y2="447" stroke="#38bdf8" stroke-width="2.5" />
    </g>

    <!-- MID-LEFT WINGS -->
    <g>
      <rect x="120" y="80" width="30" height="160" rx="2" fill="url(#solarGold)" stroke="#d97706" stroke-width="1.5" />
      <rect x="120" y="80" width="30" height="160" fill="url(#solarGrid)" opacity="0.65" />
      <rect x="120" y="272" width="30" height="160" rx="2" fill="url(#solarGold)" stroke="#d97706" stroke-width="1.5" />
      <rect x="120" y="272" width="30" height="160" fill="url(#solarGrid)" opacity="0.65" />
      <line x1="135" y1="75" x2="135" y2="437" stroke="#38bdf8" stroke-width="2" />
    </g>

    <!-- MID-RIGHT WINGS -->
    <g>
      <rect x="362" y="80" width="30" height="160" rx="2" fill="url(#solarGold)" stroke="#d97706" stroke-width="1.5" />
      <rect x="362" y="80" width="30" height="160" fill="url(#solarGrid)" opacity="0.65" />
      <rect x="362" y="272" width="30" height="160" rx="2" fill="url(#solarGold)" stroke="#d97706" stroke-width="1.5" />
      <rect x="362" y="272" width="30" height="160" fill="url(#solarGrid)" opacity="0.65" />
      <line x1="377" y1="75" x2="377" y2="437" stroke="#38bdf8" stroke-width="2" />
    </g>

    <!-- FAR-RIGHT WINGS (S6 / S4 Arrays) -->
    <!-- Top-right array pair -->
    <g>
      <rect x="400" y="70" width="36" height="170" rx="2" fill="url(#solarGold)" stroke="#d97706" stroke-width="1.5" />
      <rect x="400" y="70" width="36" height="170" fill="url(#solarGrid)" opacity="0.65" />
      <rect x="440" y="70" width="36" height="170" rx="2" fill="url(#solarGold)" stroke="#d97706" stroke-width="1.5" />
      <rect x="440" y="70" width="36" height="170" fill="url(#solarGrid)" opacity="0.65" />
      <line x1="438" y1="65" x2="438" y2="248" stroke="#38bdf8" stroke-width="2.5" />
    </g>
    <!-- Bottom-right array pair -->
    <g>
      <rect x="400" y="272" width="36" height="170" rx="2" fill="url(#solarGold)" stroke="#d97706" stroke-width="1.5" />
      <rect x="400" y="272" width="36" height="170" fill="url(#solarGrid)" opacity="0.65" />
      <rect x="440" y="272" width="36" height="170" rx="2" fill="url(#solarGold)" stroke="#d97706" stroke-width="1.5" />
      <rect x="440" y="272" width="36" height="170" fill="url(#solarGrid)" opacity="0.65" />
      <line x1="438" y1="264" x2="438" y2="447" stroke="#38bdf8" stroke-width="2.5" />
    </g>
  </g>

  <!-- PRESSURIZED HABITAT MODULES (Center complex perpendicular to truss) -->
  <g id="habitation-modules">
    <!-- Zvezda Service Module (Aft) -->
    <rect x="246" y="340" width="20" height="50" rx="4" fill="url(#metalCylinder)" stroke="#e2e8f0" stroke-width="1.2" />
    <!-- Zvezda small solar wings -->
    <rect x="210" y="360" width="34" height="12" fill="#d97706" stroke="#92400e" />
    <rect x="268" y="360" width="34" height="12" fill="#d97706" stroke="#92400e" />

    <!-- Zarya Functional Cargo Block (FGB) -->
    <rect x="247" y="295" width="18" height="42" rx="3" fill="url(#metalCylinder)" stroke="#cbd5e1" stroke-width="1.2" />
    <!-- Zarya small solar arrays -->
    <rect x="216" y="308" width="28" height="14" fill="#d97706" stroke="#92400e" />
    <rect x="268" y="308" width="28" height="14" fill="#d97706" stroke="#92400e" />

    <!-- Node 1 (Unity Module) connecting hub -->
    <rect x="244" y="255" width="24" height="38" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />

    <!-- US Lab (Destiny) Module -->
    <rect x="245" y="210" width="22" height="42" rx="4" fill="url(#metalCylinder)" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Node 2 (Harmony) Module & Forward Docking Port -->
    <rect x="244" y="168" width="24" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />

    <!-- European Columbus Laboratory (Right lateral branch) -->
    <rect x="270" y="174" width="34" height="20" rx="3" fill="url(#metalCylinder)" stroke="#cbd5e1" stroke-width="1.2" />
    <!-- ESA Star insignia detail -->
    <circle cx="287" cy="184" r="3.5" fill="#0284c7" />

    <!-- Japanese Kibo Laboratory (Left lateral branch) -->
    <rect x="208" y="172" width="34" height="22" rx="3" fill="url(#metalCylinder)" stroke="#cbd5e1" stroke-width="1.2" />
    <!-- Kibo Exposed Facility porch -->
    <rect x="194" y="176" width="12" height="14" fill="#94a3b8" stroke="#64748b" />

    <!-- Cupola 7-window observation module (Facing Earth forward) -->
    <polygon points="256,155 264,166 248,166" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" filter="url(#spaceGlow)" />
  </g>

  <!-- Robotic Arm (Canadarm2) -->
  <g id="canadarm2">
    <path d="M 235 248 Q 215 220 230 205" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <circle cx="230" cy="205" r="3" fill="#ef4444" />
  </g>

  <!-- Glowing Comm Antennas & Navigation Beacons -->
  <circle cx="256" cy="154" r="2.5" fill="#22c55e" filter="url(#spaceGlow)" />
  <circle cx="56" cy="256" r="3" fill="#ef4444" filter="url(#spaceGlow)" />
  <circle cx="456" cy="256" r="3" fill="#22c55e" filter="url(#spaceGlow)" />
</svg>
